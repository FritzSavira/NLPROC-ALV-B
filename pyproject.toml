[project]
name = "nlproc-alv-b"
version = "0.1.0"
description = "Aufgaben zur Vorlesung NLPROC-ALV-B"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jupyterlab>=4",
    # jupyter-ai-magics 2.x braucht langchain < 0.4 und damit langchain-core < 1.
    "jupyter-ai-magics==2.31.7",
    # Ab Version 3 verlangt dieses Paket langchain-core >= 1 (Konflikt mit den Magics).
    "langchain-google-genai<3",
    "python-dotenv",
    "pandas",
    # Parser fuer pd.read_xml
    "lxml",
    "pronouncing",
    "nltk>=3.10.4",
    "odenet",
    # odenet importiert pkg_resources; das fehlt in uv-Umgebungen und wurde in setuptools 82 entfernt.
    "setuptools<82",
]

[tool.uv]
package = false

# "odenet" auf PyPI ist ein fremdes Paket (ODENet von Y.Ge) - OdeNet der h_da kommt von GitHub.
[tool.uv.sources]
odenet = { git = "https://github.com/hdaSprachtechnologie/odenet" }
